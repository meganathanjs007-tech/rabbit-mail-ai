
name: Build Rabbit Mail AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o RabbitMailAI-Project.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p RabbitMailAI assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabbit-Mail-AI-APK
          path: RabbitMailAI/app/build/outputs/apk/debug/app-debug.apk
          
